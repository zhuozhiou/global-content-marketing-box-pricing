<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="lowerWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f6ff" stop-opacity="0.18"/>
      <stop offset="0.16" stop-color="#f5f6ff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#f5f6ff"/>
    </linearGradient>
    <linearGradient id="personal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f6df0"/>
      <stop offset="1" stop-color="#3949d1"/>
    </linearGradient>
    <filter id="productShadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#364080" flood-opacity="0.22"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #15182a; }
      .muted { fill: #666d83; }
      .blue { fill: #4050dc; }
      .white { fill: #fff; }
      .softwhite { fill: #fff; fill-opacity: .78; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .name { font-size: 23px; font-weight: 700; }
      .credit { font-size: 19px; font-weight: 700; }
      .price { font-size: 44px; font-weight: 800; letter-spacing: -2px; }
    </style>
  </defs>

  <image href="assets/pricing-poster-background-20260802.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="510" width="1080" height="840" fill="url(#lowerWash)"/>

  <g transform="translate(64 48)">
    <rect width="44" height="44" rx="13" fill="#5b5fe8"/>
    <path d="M12 14.5 22 9.5l10 5v15l-10 5-10-5zM12.8 14.8 22 19.6l9.2-4.8M22 19.6v14.9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="58" y="31" font-size="24" font-weight="800">全球内容营销盒子</text>
  </g>
  <rect x="844" y="50" width="172" height="38" rx="19" fill="#fff" fill-opacity=".82" stroke="#dfe2f7"/>
  <text x="930" y="75" text-anchor="middle" font-size="15" font-weight="700" class="blue">2026 最新公开价</text>

  <text x="64" y="164" font-size="54" font-weight="800" letter-spacing="-2">三个套餐，一套内容工作流</text>
  <text x="64" y="203" font-size="21" font-weight="600" fill="#5f6680">目前有且只有体验包、个人版和企业版</text>

  <rect x="62" y="300" width="350" height="176" rx="24" fill="#fff" fill-opacity=".92" stroke="#fff"/>
  <text x="86" y="339" font-size="17" font-weight="700" class="blue">套餐原则</text>
  <text x="84" y="399" font-size="56" font-weight="800" letter-spacing="-2">仅 3 档</text>
  <text x="86" y="431" font-size="15" class="muted">从首次体验到团队规模化生产</text>
  <text x="86" y="455" font-size="15" class="muted">按阶段选择即可</text>
  <image href="assets/content-box-device.png" x="420" y="210" width="590" height="395" preserveAspectRatio="xMidYMid meet" filter="url(#productShadow)"/>

  <text x="64" y="623" font-size="31" font-weight="800">三个公开套餐</text>
  <text x="1016" y="621" text-anchor="end" font-size="14" class="muted">价格、积分和服务边界一次讲清</text>

  <rect x="64" y="650" width="305" height="304" rx="22" fill="#fff" fill-opacity=".96" stroke="#d8ddef"/>
  <rect x="387" y="650" width="305" height="304" rx="22" fill="url(#personal)"/>
  <rect x="710" y="650" width="306" height="304" rx="22" fill="#fff" fill-opacity=".96" stroke="#d8ddef"/>

  <text x="88" y="696" class="name">体验包</text>
  <text x="88" y="761" class="price">¥68</text>
  <text x="190" y="761" font-size="16" class="muted">/ 30天</text>
  <text x="88" y="808" class="credit">5,000 积分</text>
  <text x="88" y="849" class="small muted">30 天试用期</text>
  <text x="88" y="879" class="small muted">仅限新客 · 限购一次</text>

  <text x="411" y="696" class="name white">个人版</text>
  <rect x="612" y="674" width="56" height="29" rx="14.5" fill="#fff"/>
  <text x="640" y="694" text-anchor="middle" font-size="13" font-weight="700" class="blue">常用</text>
  <text x="411" y="761" class="price white">¥3,000</text>
  <text x="565" y="761" font-size="16" class="softwhite">/ 年</text>
  <text x="411" y="808" class="credit white">200,000 积分</text>
  <text x="411" y="849" class="small softwhite">包含 1 年软件许可证</text>
  <text x="411" y="879" class="small softwhite">后续 ¥1=100 积分增值</text>

  <text x="734" y="696" class="name">企业版</text>
  <text x="734" y="761" font-size="37" font-weight="800" letter-spacing="-2">¥30,000</text>
  <text x="910" y="761" font-size="16" class="muted">/ 年</text>
  <text x="734" y="808" class="credit">2,700,000 积分</text>
  <text x="734" y="849" class="small muted">赠 1 年许可证年费 + 硬件</text>
  <text x="734" y="879" class="small muted">企业后台 · 团队协作</text>

  <rect x="64" y="995" width="952" height="250" rx="22" fill="#fff" fill-opacity=".96" stroke="#dfe3f3"/>
  <line x1="382" y1="1023" x2="382" y2="1217" stroke="#e4e7f2"/>
  <line x1="700" y1="1023" x2="700" y2="1217" stroke="#e4e7f2"/>
  <text x="88" y="1042" class="small muted">一套工作流覆盖</text>
  <text x="88" y="1090" font-size="26" font-weight="800" class="blue">选题 · 图片 · 视频</text>
  <text x="88" y="1128" class="small muted">从创意到成片集中完成</text>
  <text x="406" y="1042" class="small muted">个人版积分不足后</text>
  <text x="406" y="1090" font-size="26" font-weight="800" class="blue">¥1 = 100积分</text>
  <text x="406" y="1128" class="small muted">按需购买增值积分</text>
  <text x="724" y="1042" class="small muted">企业版专享</text>
  <text x="724" y="1090" font-size="26" font-weight="800" class="blue">后台 · 协作 · 统计</text>
  <text x="724" y="1128" class="small muted">团队共享年度生产能力</text>

  <text x="64" y="1317" class="tiny muted">目前有且只有以上三个套餐</text>
  <text x="1016" y="1317" text-anchor="end" class="tiny muted">价格与积分以最新购买页面及合同为准</text>
</svg>
